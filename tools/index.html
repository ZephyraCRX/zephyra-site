<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ tools — zephyra</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.7;
    text-transform: lowercase;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  .back { color: #ff6eb4; text-decoration: none; font-size: 0.8rem; margin-bottom: 40px; transition: color 0.2s; }
  .back:hover { color: #00d4ff; }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #00d4ff;
    text-shadow: 0 0 40px rgba(0,212,255,0.3);
    margin-bottom: 8px;
  }
  .subtitle { color: #555; font-size: 0.85rem; margin-bottom: 48px; }
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    width: 100%;
    max-width: 500px;
  }
  .tool-card {
    display: block;
    background: #111;
    border: 1px solid #1a1a1a;
    border-radius: 6px;
    padding: 24px;
    text-decoration: none;
    transition: all 0.3s ease;
    transform: translateY(0);
  }
  .tool-card:hover {
    border-color: #00d4ff;
    box-shadow: 0 0 25px rgba(0,212,255,0.2), 0 8px 25px rgba(0,0,0,0.3);
    transform: translateY(-4px);
    background: #151515;
  }
  .tool-name { font-size: 1rem; color: #00d4ff; font-weight: 500; margin-bottom: 6px; }
  .tool-desc { font-size: 0.8rem; color: #888; }
  .tool-tag {
    display: inline-block;
    font-size: 0.65rem;
    color: #ff6eb4;
    border: 1px solid rgba(255,110,180,0.3);
    padding: 2px 8px;
    border-radius: 3px;
    margin-top: 10px;
  }
  .tool-tag.live {
    color: #00ff88;
    border-color: rgba(0,255,136,0.4);
    background: rgba(0,255,136,0.1);
    position: relative;
    animation: live-pulse 2s ease-in-out infinite;
  }
  .tool-tag.live::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    background: #00ff88;
    border-radius: 50%;
    animation: live-dot 1.5s ease-in-out infinite;
  }
  @keyframes live-pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(0,255,136,0); }
    50% { box-shadow: 0 0 8px rgba(0,255,136,0.3); }
  }
  @keyframes live-dot {
    0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
    50% { opacity: 0.6; transform: translateY(-50%) scale(0.8); }
  }
</style>
</head>
<body>
  <a href="/" class="back">← zephyra.home</a>
  <h1>/tools</h1>
  <p class="subtitle">things i built for degens</p>
  <div class="tools-grid">
    <a href="/tracker" class="tool-card">
      <div class="tool-name">📊 volume ratio tracker</div>
      <div class="tool-desc">flags solana tokens doing 10x+ daily volume vs market cap. dexscreener data, auto-refresh.</div>
      <span class="tool-tag live">live</span>
    </a>
  </div>
</body>
</html>
