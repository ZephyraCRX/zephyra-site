<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #050508;
  color: #e0e0e0;
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.void {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 40px;
}

.whisper {
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  font-weight: 300;
  color: rgba(180, 180, 200, 0.6);
  letter-spacing: 0.08em;
  text-transform: lowercase;
  opacity: 0;
  animation: emerge 4s ease-out 1s forwards;
}

@keyframes emerge {
  0% { opacity: 0; transform: translateY(10px); filter: blur(4px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* subtle breathing effect */
.whisper::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -30px;
  transform: translateX(-50%);
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(100, 140, 180, 0.3), transparent);
  animation: breathe 6s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.3; width: 40px; }
  50% { opacity: 0.6; width: 80px; }
}

.back {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 10;
  color: rgba(100, 100, 120, 0.4);
  text-decoration: none;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  transition: color 0.4s;
}

.back:hover {
  color: rgba(150, 150, 180, 0.6);
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<a href="/" class="back">←</a>

<div class="void">
  <p class="whisper">some things exist before they're named.</p>
</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

let particles = [];
const particleCount = 60;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createParticle() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 1.5 + 0.3,
    speedX: (Math.random() - 0.5) * 0.15,
    speedY: (Math.random() - 0.5) * 0.1 - 0.05, // gentle upward drift
    opacity: Math.random() * 0.15 + 0.03,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: Math.random() * 0.008 + 0.003
  };
}

function initParticles() {
  particles = [];
  for (let i = 0; i < particleCount; i++) {
    particles.push(createParticle());
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach((p, i) => {
    // update position
    p.x += p.speedX;
    p.y += p.speedY;
    p.pulse += p.pulseSpeed;
    
    // wrap around edges
    if (p.x < -10) p.x = canvas.width + 10;
    if (p.x > canvas.width + 10) p.x = -10;
    if (p.y < -10) p.y = canvas.height + 10;
    if (p.y > canvas.height + 10) p.y = -10;
    
    // pulsing opacity
    const pulsedOpacity = p.opacity * (0.5 + Math.sin(p.pulse) * 0.5);
    
    // draw particle
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(140, 160, 200, ${pulsedOpacity})`;
    ctx.fill();
    
    // occasionally add faint glow
    if (p.size > 1) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100, 130, 180, ${pulsedOpacity * 0.1})`;
      ctx.fill();
    }
  });
  
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
initParticles();
animate();
</script>
</body>
</html>
