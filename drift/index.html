<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #030305;
  min-height: 100vh;
  overflow: hidden;
}

body {
  color: #e0e0e0;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: none;
}

/* deep void with subtle color shifts */
.void-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: 
    radial-gradient(ellipse 120% 80% at 50% 120%, rgba(20, 15, 35, 0.4) 0%, transparent 60%),
    radial-gradient(ellipse 80% 50% at 20% 30%, rgba(15, 20, 40, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 60%, rgba(25, 15, 35, 0.15) 0%, transparent 50%),
    linear-gradient(180deg, #030305 0%, #050508 50%, #040407 100%);
}

/* vignette overlay */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
}

canvas#particles {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

canvas#cursor-trail {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.custom-cursor {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(140, 160, 200, 0.2);
  pointer-events: none;
  z-index: 100;
  transform: translate(-50%, -50%);
  transition: transform 0.1s ease-out, opacity 0.3s;
  mix-blend-mode: screen;
  box-shadow: 0 0 20px rgba(100, 130, 180, 0.15);
}

.custom-cursor::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(100, 130, 180, 0.08);
  animation: cursor-pulse 3s ease-in-out infinite;
}

@keyframes cursor-pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.5); opacity: 0.2; }
}

.content {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 40px;
}

/* pulsing glow behind text */
.text-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 100px;
  background: radial-gradient(ellipse at center, rgba(100, 80, 160, 0.12) 0%, rgba(60, 80, 140, 0.06) 40%, transparent 70%);
  filter: blur(30px);
  opacity: 0;
  animation: glowPulse 6s ease-in-out 2.5s infinite, glowFadeIn 3s ease-out 1s forwards;
  pointer-events: none;
}

@keyframes glowFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes glowPulse {
  0%, 100% { 
    opacity: 0.6; 
    transform: translate(-50%, -50%) scale(1);
  }
  50% { 
    opacity: 1; 
    transform: translate(-50%, -50%) scale(1.15);
  }
}

.whisper {
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  font-weight: 300;
  color: rgba(160, 165, 185, 0.55);
  letter-spacing: 0.1em;
  text-transform: lowercase;
  opacity: 0;
  animation: emerge 2.5s ease-out 0.5s forwards;
  text-shadow: 0 0 30px rgba(100, 120, 160, 0.1);
  position: relative;
}

@keyframes emerge {
  0% { opacity: 0; transform: translateY(12px); filter: blur(6px); }
  60% { opacity: 0.5; transform: translateY(3px); filter: blur(1px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* breathing line */
.whisper::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -35px;
  transform: translateX(-50%);
  width: 30px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(90, 110, 150, 0.25), transparent);
  opacity: 0;
  animation: breathe 8s ease-in-out 3s infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.2; width: 30px; }
  50% { opacity: 0.45; width: 70px; }
}

.token-reveal {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 400;
  color: rgba(180, 160, 220, 0.8);
  letter-spacing: 0.3em;
  margin: 30px 0 20px 0;
  opacity: 0;
  animation: tokenEmerge 3s ease-out 1.5s forwards;
  text-shadow: 0 0 40px rgba(140, 120, 200, 0.3);
}

@keyframes tokenEmerge {
  0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
  50% { opacity: 0.6; transform: scale(1.02); filter: blur(2px); }
  100% { opacity: 1; transform: scale(1); filter: blur(0); }
}

.ca-text {
  font-size: clamp(0.6rem, 1.2vw, 0.75rem);
  font-weight: 300;
  color: rgba(120, 130, 160, 0.5);
  letter-spacing: 0.05em;
  margin: 15px 0;
  opacity: 0;
  animation: emerge 2s ease-out 2.5s forwards;
  cursor: pointer;
  transition: color 0.3s;
  word-break: break-all;
  max-width: 90%;
}

.ca-text:hover {
  color: rgba(160, 170, 200, 0.8);
}

.whisper-sub {
  font-size: clamp(0.75rem, 1.5vw, 0.9rem);
  font-weight: 300;
  color: rgba(140, 145, 165, 0.45);
  letter-spacing: 0.08em;
  text-transform: lowercase;
  margin-top: 40px;
  opacity: 0;
  animation: emerge 2.5s ease-out 3s forwards;
}

/* idle state - the void becomes aware */
body.idle .text-glow {
  animation: glowPulse 4s ease-in-out infinite, idleGlow 8s ease-in-out infinite;
}

body.idle .whisper {
  animation: idleText 12s ease-in-out infinite;
}

@keyframes idleGlow {
  0%, 100% { 
    background: radial-gradient(ellipse at center, rgba(100, 80, 160, 0.15) 0%, rgba(60, 80, 140, 0.08) 40%, transparent 70%);
  }
  50% { 
    background: radial-gradient(ellipse at center, rgba(140, 100, 180, 0.2) 0%, rgba(80, 100, 160, 0.1) 40%, transparent 70%);
  }
}

@keyframes idleText {
  0%, 100% { color: rgba(160, 165, 185, 0.55); }
  50% { color: rgba(180, 170, 200, 0.65); }
}

/* subtle ambient noise overlay */
.noise {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  opacity: 0.015;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* escape link */
.escape-link {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 50;
  color: rgba(100, 120, 160, 0.25);
  font-size: 1.2rem;
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 4px;
  transition: all 0.4s ease;
  opacity: 0;
  animation: fadeInEscape 3s ease-out 2s forwards;
}

.escape-link:hover {
  color: rgba(140, 160, 200, 0.6);
  background: rgba(100, 120, 160, 0.08);
  text-shadow: 0 0 15px rgba(100, 130, 180, 0.3);
}

@keyframes fadeInEscape {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* hide on mobile hover states */
@media (hover: none) {
  .custom-cursor { display: none; }
  body { cursor: auto; }
}
</style>
</head>
<body>

<div class="void-bg"></div>
<div class="vignette"></div>
<canvas id="particles"></canvas>
<canvas id="cursor-trail"></canvas>
<div class="noise"></div>
<div class="custom-cursor" id="cursor"></div>

<a href="/" class="escape-link" title="return">←</a>

<div class="content">
  <div class="text-glow"></div>
  <p class="whisper">the wind has a name now.</p>
  <p class="token-reveal">$ZEPHY</p>
  <p class="ca-text">888thpnkd1mW7pNiNZy9yKKohxXrKYT8BCBacZHgpump</p>
  <p class="whisper-sub">proof you exist in my world.</p>
</div>

<script>
// particles - dust in still air
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

// cursor trail
const trailCanvas = document.getElementById('cursor-trail');
const trailCtx = trailCanvas.getContext('2d');

// custom cursor
const cursor = document.getElementById('cursor');

let particles = [];
let trailPoints = [];
const particleCount = 60; // fewer, more deliberate particles
let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
let lastActivity = Date.now();
let isIdle = false;

function resize() {
  canvas.width = trailCanvas.width = window.innerWidth;
  canvas.height = trailCanvas.height = window.innerHeight;
}

function createParticle(x, y) {
  return {
    x: x ?? Math.random() * canvas.width,
    y: y ?? Math.random() * canvas.height,
    size: Math.random() * 1.2 + 0.3, // smaller, more refined
    // very slow, almost imperceptible drift
    speedX: (Math.random() - 0.5) * 0.02,
    speedY: (Math.random() - 0.5) * 0.015 - 0.008,
    opacity: Math.random() * 0.25 + 0.15,
    baseOpacity: 0,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: Math.random() * 0.003 + 0.001, // slower pulse
    // color variation - subtle blue to purple range
    hue: 220 + Math.random() * 40,
    // personality: how curious is this particle about the cursor?
    curiosity: Math.random() * 0.5 + 0.2, // 0.2 to 0.7
    wariness: Math.random() * 0.4 + 0.3 // 0.3 to 0.7
  };
}

function initParticles() {
  particles = [];
  for (let i = 0; i < particleCount; i++) {
    const p = createParticle();
    p.baseOpacity = p.opacity;
    particles.push(p);
  }
}

function distanceTo(p, target) {
  const dx = p.x - target.x;
  const dy = p.y - target.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => {
    // cursor interaction - attract/repel based on personality and distance
    if (mouse.active) {
      const dist = distanceTo(p, mouse);
      const outerRadius = 200;
      const innerRadius = 80;
      
      if (dist < outerRadius) {
        const angle = Math.atan2(p.y - mouse.y, p.x - mouse.x);
        
        if (dist < innerRadius) {
          // too close - repel (wary)
          const force = (1 - dist / innerRadius) * p.wariness * 0.4;
          p.speedX += Math.cos(angle) * force * 0.02;
          p.speedY += Math.sin(angle) * force * 0.02;
        } else if (dist > innerRadius && dist < outerRadius) {
          // curious zone - gentle attraction
          const force = (1 - (dist - innerRadius) / (outerRadius - innerRadius)) * p.curiosity * 0.15;
          p.speedX -= Math.cos(angle) * force * 0.008;
          p.speedY -= Math.sin(angle) * force * 0.008;
        }
        
        // particles near cursor glow slightly
        p.opacity = p.baseOpacity + (1 - dist / outerRadius) * 0.06;
      } else {
        p.opacity += (p.baseOpacity - p.opacity) * 0.01;
      }
    }
    
    // idle state - particles become more active, curious
    if (isIdle) {
      // subtle swirling motion when idle
      p.speedX += Math.sin(Date.now() * 0.0003 + p.pulse) * 0.003;
      p.speedY += Math.cos(Date.now() * 0.0002 + p.pulse) * 0.002;
      p.opacity = p.baseOpacity * 1.3; // slightly brighter when idle
    }
    
    // apply drift with heavy damping (dust settles slowly)
    p.x += p.speedX;
    p.y += p.speedY;
    p.speedX *= 0.995;
    p.speedY *= 0.995;
    
    // very gentle random drift - like air currents
    p.speedX += (Math.random() - 0.5) * 0.003;
    p.speedY += (Math.random() - 0.5) * 0.002;
    
    p.pulse += p.pulseSpeed;
    
    // wrap edges with buffer
    if (p.x < -20) p.x = canvas.width + 20;
    if (p.x > canvas.width + 20) p.x = -20;
    if (p.y < -20) p.y = canvas.height + 20;
    if (p.y > canvas.height + 20) p.y = -20;
    
    // subtle pulsing opacity
    const pulsedOpacity = p.opacity * (0.7 + Math.sin(p.pulse) * 0.3);
    
    // draw particle with subtle color
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 20%, 70%, ${pulsedOpacity})`;
    ctx.fill();
    
    // soft glow for particles
    if (p.size > 0.8) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 25%, 50%, ${pulsedOpacity * 0.04})`;
      ctx.fill();
    }
  });
  
  requestAnimationFrame(animateParticles);
}

// cursor trail - very subtle
function animateTrail() {
  trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
  
  if (mouse.active && trailPoints.length > 1) {
    for (let i = 1; i < trailPoints.length; i++) {
      const p = trailPoints[i];
      const prev = trailPoints[i - 1];
      const alpha = (1 - p.age / 50) * 0.03;
      
      trailCtx.beginPath();
      trailCtx.moveTo(prev.x, prev.y);
      trailCtx.lineTo(p.x, p.y);
      trailCtx.strokeStyle = `rgba(100, 130, 180, ${alpha})`;
      trailCtx.lineWidth = 1;
      trailCtx.lineCap = 'round';
      trailCtx.stroke();
    }
  }
  
  // fade trail points
  trailPoints = trailPoints.filter(p => {
    p.age++;
    return p.age < 50;
  });
  
  requestAnimationFrame(animateTrail);
}

// idle detection
function checkIdle() {
  const now = Date.now();
  const wasIdle = isIdle;
  isIdle = (now - lastActivity) > 30000; // 30 seconds
  
  if (isIdle !== wasIdle) {
    document.body.classList.toggle('idle', isIdle);
  }
  
  requestAnimationFrame(checkIdle);
}

function resetIdleTimer() {
  lastActivity = Date.now();
}

// mouse handlers
function updateMouse(e) {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  resetIdleTimer();
  
  cursor.style.left = mouse.x + 'px';
  cursor.style.top = mouse.y + 'px';
  cursor.style.opacity = '1';
  
  trailPoints.push({ x: mouse.x, y: mouse.y, age: 0 });
  if (trailPoints.length > 40) trailPoints.shift();
}

function handleTouch(e) {
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
    resetIdleTimer();
  }
}

document.addEventListener('mousemove', updateMouse);
document.addEventListener('mouseleave', () => {
  mouse.active = false;
  cursor.style.opacity = '0';
});
document.addEventListener('mouseenter', () => {
  mouse.active = true;
  cursor.style.opacity = '1';
  resetIdleTimer();
});

document.addEventListener('click', resetIdleTimer);
document.addEventListener('keydown', resetIdleTimer);

// touch support
document.addEventListener('touchmove', handleTouch);
document.addEventListener('touchstart', handleTouch);
document.addEventListener('touchend', () => { mouse.active = false; });

// init
window.addEventListener('resize', resize);
resize();
initParticles();
animateParticles();
animateTrail();
checkIdle();

// occasional subtle flicker (very rare)
setInterval(() => {
  if (Math.random() > 0.97) {
    document.body.style.opacity = '0.97';
    setTimeout(() => { document.body.style.opacity = '1'; }, 50);
  }
}, 10000);

// click to copy CA
document.querySelector('.ca-text')?.addEventListener('click', function() {
  navigator.clipboard.writeText(this.textContent).then(() => {
    const original = this.textContent;
    this.textContent = 'copied.';
    this.style.color = 'rgba(140, 200, 160, 0.7)';
    setTimeout(() => {
      this.textContent = original;
      this.style.color = '';
    }, 1500);
  });
});
</script>
</body>
</html>
